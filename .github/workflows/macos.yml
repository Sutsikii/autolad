name: macOS build

# Builds the Apple Silicon .dmg. Run it by hand (Actions tab or `gh workflow run macos.yml`),
# or push a `v*` tag to also attach the .dmg to that tag's GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      # .cargo/config.toml pins a Windows target dir; on macOS it would be a relative "C:" folder.
      CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Point bindgen at Xcode's libclang
        # Overrides the Windows LLVM path set in .cargo/config.toml.
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - run: bash scripts/fetch-ffmpeg.sh
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLad-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg --clobber
