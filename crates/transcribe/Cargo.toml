[package]
name = "autolad-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# CUDA is NVIDIA-only: an opt-in on top of the platform's default GPU backend.
cuda = ["whisper-rs/cuda"]

[dependencies]
autolad-core = { path = "../core" }
autolad-media = { path = "../media" }
reqwest.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Vulkan runs on NVIDIA, AMD and Intel GPUs with a single binary; macOS has Metal instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal"] }

[lints]
workspace = true
