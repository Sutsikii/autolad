[package]
name = "autolad-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Vulkan runs on NVIDIA, AMD and Intel GPUs with a single binary; CUDA is NVIDIA-only.
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
autolad-core = { path = "../core" }
autolad-media = { path = "../media" }
reqwest.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
whisper-rs.workspace = true

[lints]
workspace = true
