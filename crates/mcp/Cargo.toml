[package]
name = "autolad-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables TypeScript binding generation for the types the desktop UI consumes.
specta = ["dep:specta", "autolad-core/specta"]

[dependencies]
autolad-core = { path = "../core" }
autolad-media = { path = "../media" }
autolad-transcribe = { path = "../transcribe" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta = { workspace = true, optional = true }
tokio.workspace = true

[lints]
workspace = true
